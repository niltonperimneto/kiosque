version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      cargo-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "qtbridge*"
        update-types:
          - minor
          - patch
    ignore:
      # qtbridge is a pre-1.0 technology preview pinned with `=`; upgrade deliberately.
      # Dependabot security updates remain active even when version updates are ignored.
      - dependency-name: "qtbridge*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
