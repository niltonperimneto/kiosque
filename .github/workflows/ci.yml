name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 scripts/test.py security
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: security-results
          include-hidden-files: true
          path: .test-results/

  core:
    name: Core and service contracts
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install stable Rust with lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: python3 scripts/test.py guidance
      - run: python3 scripts/test.py lint
      - run: python3 scripts/test.py core
      - run: python3 scripts/test.py services
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: core-test-results
          include-hidden-files: true
          path: .test-results/

  desktop:
    name: Desktop (${{ matrix.backend }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora@sha256:f8593ba07b355b0af185181d590bce9b32c4f390bb125a15829059755c8a5052
    strategy:
      fail-fast: false
      matrix:
        backend: [native, broker]
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Install Git for source versioning
        run: dnf install -y git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install desktop test dependencies
        run: dnf install -y desktop-file-utils cargo rust clippy meson ninja-build gcc-c++ cmake mold qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtsvg flatpak-devel kf6-kirigami-devel kf6-ki18n-devel kf6-kirigami-addons kf6-qqc2-desktop-style dbus-daemon dbus-devel xorg-x11-server-Xvfb xauth gettext python3
      - run: python3 scripts/test.py qt --backend ${{ matrix.backend }}
      - run: python3 scripts/test.py qml --backend ${{ matrix.backend }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: desktop-test-results-${{ matrix.backend }}
          include-hidden-files: true
          path: |
            .test-results/
            build/tests-*/meson-logs/

  flatpak:
    needs: [core, desktop, security]
    name: Build Flatpak
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Install Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Configure Flatpak dependency source
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        run: |
          VERSION=$(python3 scripts/build_version.py --write build-version.json)
          flatpak-builder --user --install-deps-from=flathub --assumeyes --force-clean --ccache --require-changes --repo=repo build org.kiosque.Kiosque.json
          flatpak build-bundle repo "kiosque-${VERSION}.flatpak" org.kiosque.Kiosque

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Kiosque-Flatpak
          path: "kiosque-*.flatpak"

  rpm:
    needs: [core, desktop, security]
    name: Build RPM
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:f8593ba07b355b0af185181d590bce9b32c4f390bb125a15829059755c8a5052
    steps:
      - name: Install Git for source versioning
        run: dnf install -y git
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          dnf install -y desktop-file-utils meson gcc-c++ cargo rust cmake mold qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel kf6-kirigami-devel kf6-ki18n-devel kf6-kirigami-addons kf6-qqc2-desktop-style flatpak-devel dbus-devel rpm-build tar

      - name: Build RPM Package
        run: |
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS
          cp kiosque.spec ~/rpmbuild/SPECS/
          VERSION=$(python3 scripts/build_version.py --write build-version.json --format rpm)
          tar --transform "s,^\.,kiosque-${VERSION}," --exclude=./builddir --exclude=./rust/target --exclude=./.git -czf ~/rpmbuild/SOURCES/kiosque-${VERSION}.tar.gz .
          rpmbuild -ba --define "kiosque_version ${VERSION}" ~/rpmbuild/SPECS/kiosque.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm ./

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Kiosque-RPM
          path: "*.rpm"

  appimage:
    needs: [core, desktop, security]
    name: Build AppImage
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:f8593ba07b355b0af185181d590bce9b32c4f390bb125a15829059755c8a5052
    steps:
      - name: Install Git for source versioning
        run: dnf install -y git
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          dnf install -y desktop-file-utils meson gcc-c++ cargo rust cmake mold qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtwayland kf6-kirigami-devel kf6-ki18n-devel kf6-kirigami-addons kf6-qqc2-desktop-style kf6-sonnet plasma-breeze-qt6 qqc2-breeze-style flatpak-devel dbus-devel file wget curl file-devel

      - name: Build and Install to AppDir
        run: |
          python3 scripts/build_version.py > build-version.txt
          meson setup builddir --prefix=/usr
          meson compile -C builddir
          DESTDIR=$PWD/AppDir meson install -C builddir

      - name: Download & Extract linuxdeploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/download_build_tool.py linuxdeploy linuxdeploy
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract
          mv squashfs-root linuxdeploy-extracted
          rm -f linuxdeploy

      - name: Download & Extract linuxdeploy-plugin-qt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/download_build_tool.py linuxdeploy-plugin-qt linuxdeploy-plugin-qt
          chmod +x linuxdeploy-plugin-qt
          ./linuxdeploy-plugin-qt --appimage-extract
          mv squashfs-root linuxdeploy-plugin-qt-extracted
          rm -f linuxdeploy-plugin-qt

      - name: Build AppImage Bundle
        timeout-minutes: 15
        env:
          NO_STRIP: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export QMAKE=/usr/lib64/qt6/bin/qmake
          export QML_SOURCES_PATHS=$PWD/qml
          # 1. Overwrite the bundled patchelf in linuxdeploy and its plugins with a dummy script to prevent modifying ELF headers and causing dynamic loading crashes (NixOS/patchelf#639)
          # We also create a dummy patchelf in a local bin directory and prepend it to PATH to ensure it overrides any system patchelf.
          mkdir -p bin
          printf '#!/bin/sh\nexit 0\n' > bin/patchelf
          chmod +x bin/patchelf

          printf '#!/bin/sh\nexit 0\n' > linuxdeploy-extracted/usr/bin/patchelf
          chmod +x linuxdeploy-extracted/usr/bin/patchelf
          printf '#!/bin/sh\nexit 0\n' > linuxdeploy-plugin-qt-extracted/usr/bin/patchelf
          chmod +x linuxdeploy-plugin-qt-extracted/usr/bin/patchelf

          # Combine the extracted directories to package everything correctly.
          # We add the usr/bin directories to PATH so that linuxdeploy can find the qt plugin binary directly,
          # and also prepend the local bin directory with a dummy patchelf wrapper to ensure it's prioritized.
          export PATH=$PWD/bin:$PWD/linuxdeploy-extracted/usr/bin:$PWD/linuxdeploy-plugin-qt-extracted/usr/bin:$PATH

          # 2. Run linuxdeploy to build/assemble the AppDir (without creating the AppImage package yet)
          ./linuxdeploy-extracted/AppRun --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/org.kiosque.Kiosque.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/org.kiosque.Kiosque.svg \
            --plugin qt

          # 3. Manually copy the Wayland platform and graphics integration plugins and QML desktop style modules.
          # These are dynamically loaded by Qt6/Kirigami and not detected by linuxdeploy-plugin-qt static scan.
          cp /usr/lib64/qt6/plugins/platforms/libqwayland.so AppDir/usr/plugins/platforms/
          mkdir -p AppDir/usr/plugins/wayland-graphics-integration-client AppDir/usr/plugins/wayland-shell-integration
          cp -r /usr/lib64/qt6/plugins/wayland-graphics-integration-client/* AppDir/usr/plugins/wayland-graphics-integration-client/ || true
          cp -r /usr/lib64/qt6/plugins/wayland-shell-integration/* AppDir/usr/plugins/wayland-shell-integration/ || true

          # Copy SVG icon engine plugin so that Qt can load SVG icon themes from the host
          mkdir -p AppDir/usr/plugins/iconengines
          cp /usr/lib64/qt6/plugins/iconengines/libqsvgicon.so AppDir/usr/plugins/iconengines/

          # Copy Breeze style widget plugin and Kirigami platform plugins to provide native Breeze aesthetics
          mkdir -p AppDir/usr/plugins/styles
          cp /usr/lib64/qt6/plugins/styles/breeze6.so AppDir/usr/plugins/styles/
          mkdir -p AppDir/usr/plugins/kf6/kirigami/platform
          cp -r /usr/lib64/qt6/plugins/kf6/kirigami/platform/* AppDir/usr/plugins/kf6/kirigami/platform/

          mkdir -p AppDir/usr/qml/org/kde
          cp -r /usr/lib64/qt6/qml/org/kde/kirigamiaddons AppDir/usr/qml/org/kde/
          cp -r /usr/lib64/qt6/qml/org/kde/desktop AppDir/usr/qml/org/kde/
          cp -r /usr/lib64/qt6/qml/org/kde/qqc2desktopstyle AppDir/usr/qml/org/kde/
          cp -r /usr/lib64/qt6/qml/org/kde/sonnet AppDir/usr/qml/org/kde/
          cp -r /usr/lib64/qt6/qml/org/kde/breeze AppDir/usr/qml/org/kde/

          # Bundle KDE dependencies as real files under their required SONAMEs.
          bash scripts/bundle_kde_dependencies.sh AppDir

          # 4. Clean up base system libraries that shouldn't be bundled and cause SIGSEGV/dynamic loading conflicts.
          # We only keep Qt6 and KF6/Kirigami libraries, and let the loader resolve all other system libraries from the host.
          for libdir in AppDir/usr/lib AppDir/usr/lib64 AppDir/usr/lib/*-linux-gnu; do
            if [ -d "$libdir" ]; then
              find "$libdir" -maxdepth 1 \( -type f -o -type l \) -not -name "libQt6*" -not -name "libKF6*" -not -name "libKirigami*" -delete || true
            fi
          done

          # 3. Download and extract appimagetool to pack the AppDir into the final AppImage
          python3 scripts/download_build_tool.py appimagetool appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          VERSION=$(cat build-version.txt)
          ./squashfs-root/AppRun AppDir "Kiosque-${VERSION}-x86_64.AppImage"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Kiosque-AppImage
          path: "Kiosque-*.AppImage"

  provenance:
    name: Attest trusted packages
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    needs: [flatpak, rpm, appimage]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: Kiosque-*
          path: artifacts
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/**/*'
