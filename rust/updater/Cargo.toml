[package]
name = "kiosque-update"
description = "Background update notifier for the Kiosque Flatpak storefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "kiosque-update"
path = "src/main.rs"

[features]
default = ["libflatpak"]
libflatpak = ["kiosque-core/libflatpak"]

[dependencies]
kiosque-core = { path = "../core", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
zbus.workspace = true
futures-util.workspace = true
serde.workspace = true
