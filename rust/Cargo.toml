[workspace]
members = ["core", "app", "updater"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
# gettext-catalog (kiosque-core translations) requires Rust 1.98.
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["Kiosque Contributors"]

[workspace.dependencies]
cxx = "1.0.205"
futures-util = "0.3.34"
jiff = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = "1.54.1"
tokio-util = "0.7.20"
zbus = { version = "6.5.0", features = ["tokio"] }
