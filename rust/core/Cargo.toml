[package]
name = "kiosque-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
libflatpak = ["dep:libflatpak"]
test-util = []

[dependencies]

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-util.workspace = true
futures-util.workspace = true
async-trait = "0.1.92"
libc = "0.2.191"

# HTTP client for Flathub API
reqwest = { version = "0.13.5", features = ["json", "rustls", "form", "gzip", "brotli", "deflate", "zstd"], default-features = false }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error Handling
thiserror = "2.0.21"

# D-Bus (Flatpak availability check, signal monitoring)
zbus.workspace = true
dirs = "7.0.0"

# Caching & Cryptography for ODRS
moka = { version = "0.12.16", features = ["future"] }
sha2 = "0.11.1"
hmac = "0.13.0"
rand = "0.10.4"
zeroize = "1.9.2"

# Image decoding (original bytes are cached on disk, decoded on demand)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23.1"
fast_image_resize = "6.2.0"

# Disk cache serialization
postcard = { version = "1.2.0", default-features = false, features = ["use-std"] }

# Local AppStream catalog
flate2 = "1.1.11"
quick-xml = "0.42.0"

# Distributor configuration (Bazaar-compatible YAML)
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
regex = "1.13.2"

# libflatpak backend (optional, see [features]); gio/glib are consumed via libflatpak re-exports
libflatpak = { version = "0.7.0", features = ["v1_1"], optional = true }
jiff.workspace = true

gettext-catalog = "0.1.0"

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
tempfile.workspace = true
