[package]
name = "kiosque-core"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = []
libflatpak = ["dep:libflatpak", "dep:gio", "dep:glib"]
test-util = []

[dependencies]

# Async runtime
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "fs"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"
async-trait = "0.1.92"
libc = "0.2.191"

# HTTP client for Flathub API
reqwest = { version = "0.13.5", features = ["json", "rustls", "form", "gzip", "brotli", "deflate", "zstd"], default-features = false }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error Handling
thiserror = "2.0.21"

# D-Bus (Flatpak availability check, signal monitoring)
zbus = { version = "6.3.0", features = ["tokio"] }
dirs = "7.0.0"
chrono = "0.4.45"

# Caching & Cryptography for ODRS
moka = { version = "0.12.16", features = ["future"] }
sha2 = "0.11.1"
hmac = "0.13.0"
rand = "0.10.3"

# Image decoding (original bytes are cached on disk, decoded on demand)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.23.1"
fast_image_resize = "6.1.0"

# Disk cache serialization
postcard = { version = "1.1.3", features = ["use-std"] }

# Local AppStream catalog
flate2 = "1.1.11"
quick-xml = "0.42.0"

# Distributor configuration (Bazaar-compatible YAML)
serde_yaml_ng = "0.10.0"
regex = "1.13.1"

# libflatpak backend (optional, see [features])
libflatpak = { version = "0.7.0", optional = true }
# Keep gio/glib on the version family required by libflatpak 0.7.
gio = { version = "0.21.5", optional = true }
glib = { version = "0.21.5", optional = true }



[dev-dependencies]
tempfile = "3.27.0"
