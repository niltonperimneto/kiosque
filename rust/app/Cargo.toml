[package]
name = "kiosque"
description = "Qt Quick front end of the Kiosque Flatpak storefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "kiosque"
path = "src/lib.rs"

[[bin]]
name = "kiosque"
path = "src/main.rs"

# Qt Quick Test runner over tests/qml with isolated services. Not installed.
[[bin]]
name = "kiosque-quick-test"
path = "src/bin/quick_test.rs"
required-features = ["test-util"]

[features]
default = ["libflatpak"]
libflatpak = ["kiosque-core/libflatpak"]
test-util = ["kiosque-core/test-util"]

[dependencies]
kiosque-core = { path = "../core", default-features = false }
# Technology preview: every release has changed the API. Upgrade deliberately.
qtbridge = { version = "=0.4.1", features = ["serde_json"] }
# Already a qtbridge dependency; used for QQuickStyle and the desktop file name.
cxx-qt-lib = { version = "0.10.0", default-features = false, features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
cxx.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true

zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
cxx-build = "1.0.205"
