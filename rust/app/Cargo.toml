[package]
name = "kiosque"
description = "Qt Quick front end of the Kiosque Flatpak storefront"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "kiosque"
crate-type = ["staticlib", "lib"]

[features]
default = ["libflatpak"]
libflatpak = ["kiosque-core/libflatpak"]
test-util = ["kiosque-core/test-util"]

[dependencies]
kiosque-core = { path = "../core", default-features = false }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = "0.4.45"
# Transitional: the C++ image provider adapter (src/image_cache.rs).
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
cxx-qt-build = "0.10.0"
